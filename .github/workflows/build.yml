name: build-and-test

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.302
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AncestorsEnhanced.slnx --locked-mode
        continue-on-error: false

      - name: Build
        run: dotnet build AncestorsEnhanced.slnx -c Release --no-restore

      - name: Test with coverage
        run: dotnet test AncestorsEnhanced.slnx -c Release --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AncestorsEnhanced-coverage-${{ matrix.rid }}
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Package vulnerability gate
        shell: pwsh
        run: |
          $json = dotnet list AncestorsEnhanced.slnx package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { throw 'Package vulnerability scan failed.' }
          $report = $json | ConvertFrom-Json
          $vulnerable = @(
            foreach ($project in $report.projects) {
              foreach ($framework in @($project.frameworks)) {
                foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                  if ($null -ne $package -and $null -ne $package.vulnerabilities -and @($package.vulnerabilities).Count -gt 0) { $package }
                }
              }
            }
          )
          if ($vulnerable.Count -gt 0) {
            $vulnerable | ConvertTo-Json -Depth 10 | Write-Output
            throw 'Vulnerable NuGet packages were found.'
          }

      - name: Publish
        # Folder publish (no single-file bundle): the release zip provides the
        # compression, and antivirus scanners can inspect every managed and
        # native file individually instead of treating one compressed,
        # self-extracting executable as a packed payload.
        run: dotnet publish src/AncestorsEnhanced.App/AncestorsEnhanced.App.csproj -c Release -r ${{ matrix.rid }} --no-restore -p:PublishSingleFile=false -p:SelfContained=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/${{ matrix.rid }}

      - name: Prepare portable package
        shell: pwsh
        run: |
          $package = Resolve-Path "artifacts/${{ matrix.rid }}"
          Get-ChildItem -LiteralPath $package -Filter '*.pdb' -File -Recurse |
            Remove-Item -Force
          Copy-Item -LiteralPath README.md, LICENSE -Destination $package
          Get-ChildItem -LiteralPath $package -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $relative = $_.FullName.Substring($package.Path.Length + 1).Replace('\', '/')
              "$(Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName | Select-Object -ExpandProperty Hash)  $relative"
            } |
            Set-Content -Encoding ascii (Join-Path $package 'SHA256SUMS.txt')

      - name: Smoke test Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'ancestors-version.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'ancestors-version-error.txt'
          $process = Start-Process ./artifacts/win-x64/AncestorsEnhanced.App.exe -ArgumentList '--version' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $output = (Get-Content -Raw $stdout).Trim()
          if ($process.ExitCode -ne 0 -or $output -ne 'Ancestors Enhanced Configurator 1.0.0') { throw "Windows publish smoke test failed: $output" }

      - name: Smoke test Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x ./artifacts/linux-x64/AncestorsEnhanced.App
          output="$(./artifacts/linux-x64/AncestorsEnhanced.App --version)"
          test "$output" = "Ancestors Enhanced Configurator 1.0.0"

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = 'artifacts/AncestorsEnhanced-1.0.0-win-x64.zip'
          Compress-Archive -Path 'artifacts/win-x64/*' -DestinationPath $archive
          "$(Get-FileHash -Algorithm SHA256 -LiteralPath $archive | Select-Object -ExpandProperty Hash)  $(Split-Path -Leaf $archive)" |
            Set-Content -Encoding ascii "$archive.sha256"

      - name: Create Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="AncestorsEnhanced-1.0.0-linux-x64.zip"
          (cd artifacts/linux-x64 && zip -q -r "../$archive" .)
          (cd artifacts && sha256sum "$archive" > "$archive.sha256")

      - name: Verify Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'ancestors-package'
          Expand-Archive -LiteralPath artifacts/AncestorsEnhanced-1.0.0-win-x64.zip -DestinationPath $destination
          if (Get-ChildItem -LiteralPath $destination -Filter '*.pdb' -File -Recurse) { throw 'Windows archive contains debug symbols.' }
          $stdout = Join-Path $env:RUNNER_TEMP 'ancestors-package-version.txt'
          $process = Start-Process (Join-Path $destination 'AncestorsEnhanced.App.exe') -ArgumentList '--version' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $stdout
          $output = (Get-Content -Raw $stdout).Trim()
          if ($process.ExitCode -ne 0 -or $output -ne 'Ancestors Enhanced Configurator 1.0.0') { throw "Windows archive smoke test failed: $output" }

      - name: Verify Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          destination="$RUNNER_TEMP/ancestors-package"
          unzip -q artifacts/AncestorsEnhanced-1.0.0-linux-x64.zip -d "$destination"
          test -x "$destination/AncestorsEnhanced.App"
          test -z "$(find "$destination" -name '*.pdb' -print -quit)"
          output="$("$destination/AncestorsEnhanced.App" --version)"
          test "$output" = "Ancestors Enhanced Configurator 1.0.0"

      - name: Upload publish artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AncestorsEnhanced-${{ matrix.rid }}
          path: |
            artifacts/AncestorsEnhanced-1.0.0-${{ matrix.rid }}.zip
            artifacts/AncestorsEnhanced-1.0.0-${{ matrix.rid }}.zip.sha256
          if-no-files-found: error
